<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGradient)"/>

  <!-- Sun/horizon arc -->
  <path d="M 50 280 Q 200 180 350 280" fill="none" stroke="url(#sunGradient)" stroke-width="4"/>

  <!-- Desert ground line -->
  <path d="M 30 300 Q 100 290 200 295 Q 300 300 370 290" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.6"/>

  <!-- Small saguaro left -->
  <g fill="#1a1a2e" opacity="0.4">
    <rect x="70" y="240" width="8" height="50" rx="4"/>
    <rect x="60" y="250" width="8" height="25" rx="4" transform="rotate(-20 64 262)"/>
    <rect x="78" y="255" width="6" height="20" rx="3" transform="rotate(25 81 265)"/>
  </g>

  <!-- Small saguaro right -->
  <g fill="#1a1a2e" opacity="0.4">
    <rect x="320" y="250" width="6" height="40" rx="3"/>
    <rect x="312" y="258" width="5" height="18" rx="2" transform="rotate(-15 314 267)"/>
  </g>

  <!-- Runner in saguaro pose - main figure -->
  <g fill="#ffffff">
    <!-- Head with cap -->
    <ellipse cx="200" cy="95" rx="22" ry="24"/>
    <!-- Cap brim -->
    <ellipse cx="200" cy="78" rx="26" ry="8"/>
    <rect x="180" y="70" width="40" height="12" rx="2"/>

    <!-- Body/torso -->
    <path d="M 185 115
             L 180 185
             Q 200 195 220 185
             L 215 115
             Q 200 110 185 115" />

    <!-- Left arm (up high like saguaro) -->
    <path d="M 180 125
             Q 140 115 130 70
             L 138 68
             Q 145 105 178 118
             Z" />
    <!-- Left hand -->
    <ellipse cx="134" cy="65" rx="8" ry="12" transform="rotate(-15 134 65)"/>

    <!-- Right arm (up at angle like saguaro arm) -->
    <path d="M 220 125
             Q 255 110 275 85
             L 268 80
             Q 252 102 222 118
             Z" />
    <!-- Right hand -->
    <ellipse cx="274" cy="78" rx="8" ry="12" transform="rotate(30 274 78)"/>

    <!-- Left leg -->
    <path d="M 185 185
             L 175 260
             Q 172 275 168 285
             L 180 288
             Q 182 278 184 265
             L 192 190
             Z" />
    <!-- Left shoe -->
    <ellipse cx="172" cy="290" rx="14" ry="6"/>

    <!-- Right leg (slightly lifted, running pose) -->
    <path d="M 215 185
             L 230 250
             Q 238 265 245 275
             L 235 280
             Q 230 268 225 255
             L 210 190
             Z" />
    <!-- Right shoe -->
    <ellipse cx="242" cy="280" rx="14" ry="6" transform="rotate(15 242 280)"/>
  </g>

  <!-- Text arc at bottom -->
  <defs>
    <path id="textArc" d="M 60 340 Q 200 380 340 340" fill="none"/>
  </defs>
  <text fill="#ffd700" font-family="Arial Black, sans-serif" font-size="24" font-weight="bold" letter-spacing="3">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">TARA'S BIRTHDAY RUN</textPath>
  </text>

  <!-- 39 badge -->
  <circle cx="200" cy="330" r="25" fill="#ffd700"/>
  <text x="200" y="338" fill="#1a1a2e" font-family="Arial Black, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">39</text>
</svg>
